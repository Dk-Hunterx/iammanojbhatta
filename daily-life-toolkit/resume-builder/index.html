<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Resume Builder · Daily Life Toolkit</title><meta name="description" content="Fill the form — get a clean, printable one-page resume. Perfect for students."><style>:root{--pri:#2A3490;--pri2:#2563EB;--ink:#1C2333;--mut:#6B7280;--line:#E5E7F0;--bg:#F6F7FB;--card:#fff;--ok:#12805C;--bad:#C0392B}
*{box-sizing:border-box;margin:0}body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:22px}header .eyebrow{color:var(--pri2);font-weight:700;letter-spacing:.14em;font-size:.72rem;text-transform:uppercase}
h1{font-size:1.9rem;margin:6px 0 4px}header p{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(29,36,102,.06);margin-bottom:18px}
label{font-weight:600;font-size:.88rem;display:block;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.btn{display:inline-block;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border:0;padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer;font:inherit}
.btn.ghost{background:#EEF1FD;color:var(--pri);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin-top:8px}footer a{color:var(--pri2);text-decoration:none;font-weight:600}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.stat b{color:var(--pri)}
.out{font-size:1.12rem}.big{font-size:2rem;font-weight:800;color:var(--pri);text-align:center}
.drop{border:2px dashed var(--pri2);border-radius:14px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;background:#F2F5FF}
pre{background:#0D1117;color:#C9D1D9;padding:14px;border-radius:10px;overflow:auto;font-size:.86rem}</style></head><body><div style="background:#1D2466;color:#fff;padding:9px 16px;font-family:sans-serif;font-size:.9rem"><a href="../index.html" style="color:#9DB8FF;text-decoration:none;font-weight:700">← All Tools</a> <span style="opacity:.75">· Daily Life Toolkit by Manoj Bhatta</span></div><div class="wrap">
<header><div class="eyebrow">Study & Teaching</div><h1>📄 Simple Resume Builder</h1><p>Fill the form — get a clean, printable one-page resume. Perfect for students.</p></header>
<div class="card"><div class="row"><div><label>Full name</label><input id="nm" type="text" placeholder="Your name"></div>
<div><label>Title (e.g. Student / Developer)</label><input id="ti" type="text" placeholder="Aspiring Web Developer"></div></div>
<div class="row"><div><label>Email</label><input id="em" type="text"></div><div><label>Phone</label><input id="ph" type="text"></div></div>
<label>About you (2–3 lines)</label><textarea id="ab" rows="3"></textarea>
<label>Education (one per line)</label><textarea id="ed" rows="3" placeholder="+2 — Ghodaghodi Multiple Campus&#10;SEE — …"></textarea>
<label>Skills (comma separated)</label><input id="sk" type="text" placeholder="HTML, CSS, Python, MS Office">
<label>Experience / Projects (one per line)</label><textarea id="ex" rows="3"></textarea>
<p style="margin-top:14px"><button class="btn" onclick="gen()">Build my resume</button> <button class="btn ghost" onclick="window.print()">🖨️ Print / Save as PDF</button></p></div>
<div class="card" id="cv" style="display:none"></div>
<style>@media print{body *{visibility:hidden}#cv,#cv *{visibility:visible}#cv{position:absolute;left:0;top:0;width:100%}}</style>
<footer>Built by <a href="https://github.com/iammanojbhatta">Manoj Bhatta</a> · Free tool — runs 100% in your browser, nothing is uploaded.</footer>
</div><script>const $=id=>document.getElementById(id);
function lines(id){return $(id).value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>'<li>'+s+'</li>').join('')}
function gen(){const nm=$('nm').value||'Your Name';
$('cv').innerHTML='<h1 style="color:#2A3490;margin-bottom:2px">'+nm+'</h1><p style="color:#2563EB;font-weight:700">'+($('ti').value||'')+'</p>'
+'<p style="color:#555">'+($('em').value||'')+($('ph').value?' · '+$('ph').value:'')+'</p>'
+($('ab').value?'<h3 style="margin-top:16px;color:#2A3490">About</h3><p>'+$('ab').value+'</p>':'')
+($('ed').value?'<h3 style="margin-top:16px;color:#2A3490">Education</h3><ul>'+lines('ed')+'</ul>':'')
+($('sk').value?'<h3 style="margin-top:16px;color:#2A3490">Skills</h3><p>'+$('sk').value.split(',').map(s=>'<span style="background:#EEF1FD;border-radius:99px;padding:3px 11px;margin:2px;display:inline-block">'+s.trim()+'</span>').join('')+'</p>':'')
+($('ex').value?'<h3 style="margin-top:16px;color:#2A3490">Experience & Projects</h3><ul>'+lines('ex')+'</ul>':'');
$('cv').style.display='block';$('cv').scrollIntoView({behavior:'smooth'})}</script></body></html>
