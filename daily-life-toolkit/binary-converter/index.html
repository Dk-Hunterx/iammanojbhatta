<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text ↔ Binary · Daily Life Toolkit</title><meta name="description" content="Convert text to binary code and back — fun for students."><style>:root{--pri:#2A3490;--pri2:#2563EB;--ink:#1C2333;--mut:#6B7280;--line:#E5E7F0;--bg:#F6F7FB;--card:#fff;--ok:#12805C;--bad:#C0392B}
*{box-sizing:border-box;margin:0}body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:22px}header .eyebrow{color:var(--pri2);font-weight:700;letter-spacing:.14em;font-size:.72rem;text-transform:uppercase}
h1{font-size:1.9rem;margin:6px 0 4px}header p{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(29,36,102,.06);margin-bottom:18px}
label{font-weight:600;font-size:.88rem;display:block;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.btn{display:inline-block;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border:0;padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer;font:inherit}
.btn.ghost{background:#EEF1FD;color:var(--pri);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin-top:8px}footer a{color:var(--pri2);text-decoration:none;font-weight:600}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.stat b{color:var(--pri)}
.out{font-size:1.12rem}.big{font-size:2rem;font-weight:800;color:var(--pri);text-align:center}
.drop{border:2px dashed var(--pri2);border-radius:14px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;background:#F2F5FF}
pre{background:#0D1117;color:#C9D1D9;padding:14px;border-radius:10px;overflow:auto;font-size:.86rem}</style></head><body><div style="background:#1D2466;color:#fff;padding:9px 16px;font-family:sans-serif;font-size:.9rem"><a href="../index.html" style="color:#9DB8FF;text-decoration:none;font-weight:700">← All Tools</a> <span style="opacity:.75">· DK Hunter Daily Life Toolkit</span></div><div class="wrap">
<header><div class="eyebrow">Text Tools</div><h1>0️⃣ Text ↔ Binary</h1><p>Convert text to binary code and back — fun for students.</p></header>
<div class="card"><label>Your text</label><textarea id="tx" rows="8" placeholder="Type or paste your text here…"></textarea>
<p id="cnt" style="color:var(--mut);font-size:.88rem;margin-top:6px"></p>
<p style="margin-top:12px"><button class="btn" onclick="t0()">Text → Binary</button> <button class="btn ghost" onclick="t1()">Binary → Text</button> </p>
<label style="margin-top:12px">Result</label><textarea id="rs" rows="8" readonly></textarea>
<p style="margin-top:10px"><button class="btn ghost" onclick="cp()">Copy result</button></p></div>
<footer>Built by <a href="https://github.com/Dk-Hunterx">DK Hunter</a> · Free tool — runs 100% in your browser, nothing is uploaded.</footer>
</div><script>const $=id=>document.getElementById(id);
function cnt(){const v=$('tx').value;$('cnt').textContent=v.length+' characters · '+(v.trim()?v.trim().split(/\s+/).length:0)+' words · '+(v?v.split('\n').length:0)+' lines'}
$('tx').addEventListener('input',cnt);cnt();
function cp(){$('rs').select();navigator.clipboard.writeText($('rs').value);alert('Copied!')}
function t0(){$('rs').value=$('tx').value.split('').map(c=>c.charCodeAt(0).toString(2).padStart(8,'0')).join(' ')}function t1(){try{$('rs').value=$('tx').value.trim().split(/\s+/).map(b=>String.fromCharCode(parseInt(b,2))).join('')}catch(e){alert('Invalid binary')}}</script></body></html>
