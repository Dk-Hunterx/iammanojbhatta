<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Habit Tracker · Daily Life Toolkit</title><meta name="description" content="Tick your habits each day this week — saved on your device."><style>:root{--pri:#2A3490;--pri2:#2563EB;--ink:#1C2333;--mut:#6B7280;--line:#E5E7F0;--bg:#F6F7FB;--card:#fff;--ok:#12805C;--bad:#C0392B}
*{box-sizing:border-box;margin:0}body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:22px}header .eyebrow{color:var(--pri2);font-weight:700;letter-spacing:.14em;font-size:.72rem;text-transform:uppercase}
h1{font-size:1.9rem;margin:6px 0 4px}header p{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(29,36,102,.06);margin-bottom:18px}
label{font-weight:600;font-size:.88rem;display:block;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.btn{display:inline-block;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border:0;padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer;font:inherit}
.btn.ghost{background:#EEF1FD;color:var(--pri);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin-top:8px}footer a{color:var(--pri2);text-decoration:none;font-weight:600}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.stat b{color:var(--pri)}
.out{font-size:1.12rem}.big{font-size:2rem;font-weight:800;color:var(--pri);text-align:center}
.drop{border:2px dashed var(--pri2);border-radius:14px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;background:#F2F5FF}
pre{background:#0D1117;color:#C9D1D9;padding:14px;border-radius:10px;overflow:auto;font-size:.86rem}</style></head><body><div style="background:#1D2466;color:#fff;padding:9px 16px;font-family:sans-serif;font-size:.9rem"><a href="../index.html" style="color:#9DB8FF;text-decoration:none;font-weight:700">← All Tools</a> <span style="opacity:.75">· Daily Life Toolkit by Manoj Bhatta</span></div><div class="wrap">
<header><div class="eyebrow">Fun & Daily</div><h1>🌱 Weekly Habit Tracker</h1><p>Tick your habits each day this week — saved on your device.</p></header>
<div class="card"><div class="row"><div><label>New habit</label><input id="hb" type="text" placeholder="e.g. Read 20 minutes"></div></div>
<p style="margin-top:10px"><button class="btn" onclick="add()">Add habit</button> <button class="btn ghost" onclick="week()">New week (reset)</button></p>
<div id="tbl" style="margin-top:14px;overflow-x:auto"></div></div>
<footer>Built by <a href="https://github.com/iammanojbhatta">Manoj Bhatta</a> · Free tool — runs 100% in your browser, nothing is uploaded.</footer>
</div><script>let H=JSON.parse(localStorage.getItem('habits')||'[]');const $=id=>document.getElementById(id);const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function save(){localStorage.setItem('habits',JSON.stringify(H));render()}
function add(){const v=$('hb').value.trim();if(!v)return;H.push({t:v,d:[0,0,0,0,0,0,0]});$('hb').value='';save()}
function tog(i,d){H[i].d[d]=H[i].d[d]?0:1;save()}function del(i){H.splice(i,1);save()}function week(){if(confirm('Start a fresh week?')){H.forEach(h=>h.d=[0,0,0,0,0,0,0]);save()}}
function render(){if(!H.length){$('tbl').innerHTML='<p style="color:var(--mut)">No habits yet — add your first one.</p>';return}
let s='<table style="width:100%;border-collapse:collapse;min-width:480px"><tr><th style="text-align:left;padding:7px">Habit</th>'+DAYS.map(d=>'<th>'+d+'</th>').join('')+'<th>%</th><th></th></tr>';
H.forEach((h,i)=>{const pct=Math.round(h.d.reduce((a,b)=>a+b,0)/7*100);s+='<tr style="border-top:1px solid var(--line)"><td style="padding:7px"><b>'+h.t+'</b></td>'+h.d.map((v,d)=>'<td style="text-align:center"><input type="checkbox" style="width:19px;height:19px" '+(v?'checked':'')+' onchange="tog('+i+','+d+')"></td>').join('')+'<td style="text-align:center"><b>'+pct+'%</b></td><td><button onclick="del('+i+')" style="border:0;background:none;color:var(--bad);font-weight:700;cursor:pointer">✕</button></td></tr>'});
$('tbl').innerHTML=s+'</table>'}render();</script></body></html>
